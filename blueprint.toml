# Settings for the blueprint tool. See docs/cli.md in chrisflav/blueprint.

[project]
name = "riemann-hypothesis"
title = "Riemann Hypothesis"
dir = "blueprint"

[lean]
# What `blueprint extract` imports. `Main` imports everything below it; every
# file of the submission is in its import closure.
modules = ["Main"]
descend = ["Main", "Statements", "Supplements", "BuildAid", "CompanionTheory", "Development",
           "Formalism", "GroundTheory", "Lemmata", "PositivityTheory", "ReciprocityTheory"]

[site]
numbering = "nested"

# `source` attributes a statement to the literature. It is shown in the
# statement's heading, as LaTeX shows the optional argument of a theorem:
# "Theorem 4.2 (Kato's Euler system; Kato [kato-2004, Thm. 12.5])."
[kinds.theorem]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "source"]
[kinds.proposition]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "source"]
[kinds.lemma]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "source"]
[kinds.corollary]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "source"]
[kinds.definition]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "source"]
[kinds.remark]
attrs = ["title", "lean", "review", "tags", "order", "aliases", "owner", "source"]

[katex.macros]
"\\C" = "\\mathbb C"
"\\R" = "\\mathbb R"
"\\Q" = "\\mathbb Q"
"\\Z" = "\\mathbb Z"
"\\N" = "\\mathbb N"
"\\A" = "\\mathbb A"
"\\GL" = "\\operatorname{GL}"
"\\U" = "\\operatorname{U}"
"\\Gal" = "\\operatorname{Gal}"
"\\Re" = "\\operatorname{Re}"
"\\Im" = "\\operatorname{Im}"
"\\Res" = "\\operatorname{Res}"
"\\rec" = "\\operatorname{rec}"
"\\Fq" = "\\mathbb F_q"
"\\Qp" = "\\mathbb Q_p"
"\\Ql" = "\\mathbb Q_\\ell"
"\\Qlbar" = "\\overline{\\mathbb Q}_\\ell"
"\\Qbar" = "\\overline{\\mathbb Q}"
